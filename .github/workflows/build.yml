name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: UI tests
        run: node --test tests/ui

      - name: Check UI scripts parse
        shell: bash
        run: for f in src/Wimap/ui/*.js; do node --check "$f"; done

      - name: .NET tests
        run: dotnet test tests/Wimap.Tests -c Release

      # A tag like v1.2.0 becomes the app and installer version; other builds keep the version in Wimap.csproj.
      - name: Publish
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.Substring(1) } else { $null }
          if ($v) { dotnet publish src/Wimap -c Release -o dist -p:Version=$v } else { dotnet publish src/Wimap -c Release -o dist }

      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc /Q installer\Wimap.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v5
        with:
          name: Wimap
          path: |
            dist/Wimap.exe
            dist/WimapSetup-*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: Wimap
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Wimap ${GITHUB_REF_NAME#v}" --generate-notes
